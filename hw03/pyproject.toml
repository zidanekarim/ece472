# pyproject.toml.jinja

[project]
name = "hw03"
version = "0.1.0"
description = "Convolutional Neural Network Classifier"
readme = "README.md"
authors = [
    { name = "Zidane Karim", email = "zidane.karim@cooper.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "structlog",
    "rich",
    "numpy",
    "pydantic",
    "pydantic-settings>=2.10.1",
    "matplotlib>=3.10.5",
    "tqdm>=4.67.1",
    "jax[cpu]>=0.7.1",
    "flax>=0.11.2",
    "optax>=0.2.4",
    "scikit-learn",
]

[project.scripts]
hw03 = "hw03:main"
hw03-evaluate = "hw03.evaluate:main"
[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
