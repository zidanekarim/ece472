# pyproject.toml.jinja

[project]
name = "hw04"
version = "0.1.0"
description = "CIFAR-10 Classifier"
readme = "README.md"
authors = [
    { name = "Zidane Karim", email = "zidane.karim@cooper.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "structlog",
    "rich",
    "numpy",
    "pydantic",
    "pydantic-settings>=2.10.1",
    "matplotlib>=3.10.5",
    "tqdm>=4.67.1",
    "jax[cuda13]>=0.7.1",
    "flax>=0.11.2",
    "optax>=0.2.4",
    "scikit-learn",
    "datasets>=5.1.0",
    "pandas>=3.0.6",
    "tabulate>=0.10.0",
    "orbax>=0.1.9",
]

[project.scripts]
hw04 = "hw04:main"
hw04-evaluate = "hw04.evaluate:main"
[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
