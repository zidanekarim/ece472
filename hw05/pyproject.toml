# pyproject.toml.jinja

[project]
name = "hw05"
version = "0.1.0"
description = "My new homework assignment."
readme = "README.md"
authors = [
    { name = "Zidane Karim", email = "zidane.karim@cooper.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "structlog",
    "rich",
    "numpy",
    "pydantic",
    "pydantic-settings>=2.10.1",
    "matplotlib>=3.10.5",
    "tqdm>=4.67.1",
    "jax[cpu, cuda13]>=0.7.1",
    "flax>=0.11.2",
    "optax>=0.2.4",
    "scikit-learn",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
hw05 = "hw05:main"
hw05-evaluate = "hw05.evaluate:main"
[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
